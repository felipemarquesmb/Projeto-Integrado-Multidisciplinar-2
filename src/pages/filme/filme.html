<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Filme | CineMatch</title>
  <link rel="stylesheet" href="filme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="../home/home.html" class="logo">
        <i class="fas fa-film"></i>
        <span>CineMatch</span>
      </a>
      <nav class="nav">
        <a href="../home/home.html" class="nav-link">Início</a>
        <a href="../explorar/explorar.html" class="nav-link">Explorar</a>
        <a href="../favoritos/favoritos.html" class="nav-link">Favoritos</a>
        <a href="../perfil/perfil.html" class="nav-link">Perfil</a>
      </nav>
      <div class="header-actions">
        <button class="btn-icon"><i class="fas fa-search"></i></button>
        <button class="btn-icon"><i class="fas fa-bell"></i></button>
      </div>
    </div>
  </header>

  <main>
    
    <section class="filme-hero" id="filme-hero">
      <div class="filme-hero-overlay">
        <div class="container filme-hero-content">
          <img id="filme-poster" class="filme-poster" src="" alt="Poster">
          <div class="filme-info">
            <h1 id="filme-titulo">Carregando...</h1>
            <div class="filme-meta">
              <span id="filme-ano"></span>
              <span id="filme-duracao"></span>
              <span id="filme-nota" class="nota"></span>
            </div>
            <p id="filme-generos" class="generos"></p>
            <p id="filme-sinopse" class="sinopse"></p>
            <div class="filme-actions">
              <button class="btn btn-primary" id="btn-favoritar">
                <i class="fas fa-heart"></i> Favoritar
              </button>
              <button class="btn btn-outline" id="btn-trailer">
                <i class="fas fa-play"></i> Trailer
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="container">
      
      <section class="section">
        <h2>Elenco principal</h2>
        <div class="elenco" id="filme-elenco">
          
        </div>
      </section>

      <section class="section">
        <h2>Direção</h2>
        <p id="filme-diretor" class="diretor"></p>
      </section>

      
      <section class="section">
        <h2>Filmes semelhantes</h2>
        <div class="movies-row" id="filmes-semelhantes"></div>
      </section>

      
      <section class="section avaliar-section">
        <h2>Sua avaliação</h2>
        <div class="avaliar-box">
          <div class="estrelas">
            <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
          </div>
          <textarea placeholder="Escreva um comentário sobre o filme..." rows="4"></textarea>
          <button class="btn btn-primary">Enviar avaliação</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 CineMatch — Projeto Integrado Multidisciplinar II</p>
    </div>
  </footer>

  <script src="../../config.js"></script>
  <script src="../../index.js"></script>
  <script src="filme.js"></script>
</body>
</html>
