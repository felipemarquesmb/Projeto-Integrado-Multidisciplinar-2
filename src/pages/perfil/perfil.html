<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | CineMatch</title>
  <link rel="stylesheet" href="perfil.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="../home/home.html" class="logo">
        <i class="fas fa-film"></i>
        <span>CineMatch</span>
      </a>
      <nav class="nav">
        <a href="../home/home.html" class="nav-link">Início</a>
        <a href="../explorar/explorar.html" class="nav-link">Explorar</a>
        <a href="../favoritos/favoritos.html" class="nav-link">Favoritos</a>
        <a href="perfil.html" class="nav-link active">Perfil</a>
      </nav>
      <div class="header-actions">
        <button class="btn-icon"><i class="fas fa-search"></i></button>
        <button class="btn-icon"><i class="fas fa-bell"></i></button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="perfil-header">
      <div class="avatar">
        <i class="fas fa-user"></i>
      </div>
      <div class="perfil-info">
        <h1>Usuário CineMatch</h1>
        <p>@usuario • Membro desde 2026</p>
        <div class="stats">
          <div><strong>0</strong><span>Favoritos</span></div>
          <div><strong>0</strong><span>Avaliados</span></div>
          <div><strong>0</strong><span>Histórico</span></div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Histórico recente</h2>
      <div class="movies-row" id="historico"></div>
    </section>

    <section class="section">
      <h2>Filmes avaliados</h2>
      <div class="movies-row" id="avaliados"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 CineMatch — Projeto Integrado Multidisciplinar II</p>
    </div>
  </footer>

  <script src="../../config.js"></script>
  <script src="../../index.js"></script>
  <script src="perfil.js"></script>
</body>
</html>
